<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5efe7" />
    <title>Irina Bogovich</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="slideshow">
      <header class="topbar" aria-label="Статус слайд-шоу">
        <p class="counter" id="slide-counter">1 / 17</p>
      </header>

      <section class="stage" aria-live="polite">
        <div class="slide-stack">
          <article class="slide is-active" data-layer="0" aria-hidden="false">
            <img
              class="slide-image"
              src="assets/images/slide-01.jpg"
              alt="Слайд 1"
            />
          </article>
          <article class="slide" data-layer="1" aria-hidden="true">
            <img class="slide-image" src="" alt="" />
          </article>
        </div>
      </section>

      <div class="controls" role="group" aria-label="Управление слайд-шоу">
        <button class="control-button" id="prev-button" type="button">
          Предыдущий
        </button>
        <button
          class="control-button control-button-primary"
          id="play-button"
          type="button"
        >
          Пауза
        </button>
        <button class="control-button" id="next-button" type="button">
          Следующий
        </button>
        <button class="control-button" id="audio-button" type="button">
          Включить музыку
        </button>
      </div>

      <audio id="background-audio" preload="none" loop></audio>
    </main>
  </body>
</html>
